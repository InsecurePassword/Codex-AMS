name: Bootstrap initial release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap initial release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codex-ams-candidate
          cat .bootstrap-payload/*.part | base64 -d | tar -xzf - -C /tmp/codex-ams-candidate
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/codex-ams-candidate/. .
      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'InsecurePassword'
          git config user.email '107284711+InsecurePassword@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Initial release'
          git push origin HEAD:main
