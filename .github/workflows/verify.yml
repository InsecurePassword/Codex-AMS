name: Verify AMS repository

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile repository Python
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: >-
          python -m py_compile
          verification/verify_repository.py
          verification/verify_contract_scenarios.py
          verification/verify_daybreak_blue.py
          verification/verify_installers.py
          verification/verify_installers_windows.py
          verification/verify_runtime_observation.py
          verification/verify_local_openai_lane.py
          tools/install_harnesses.py
          verification/verify_harness_installers.py
          verification/verify_desktop_bootstrap.py
          tools/measure_context.py
          tools/report_sizes.py
          extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
          extensions/ams-local-openai-lane/tools/local_openai_lane.py

      - name: Verify repository and core package
        run: python verification/verify_repository.py

      - name: Verify configuration and orchestration contracts
        run: python verification/verify_contract_scenarios.py

      - name: Verify Daybreak Blue fallback
        run: python verification/verify_daybreak_blue.py

      - name: Verify local OpenAI-compatible companion
        run: python verification/verify_local_openai_lane.py

      - name: Verify runtime-observation companion
        run: python verification/verify_runtime_observation.py

      - name: Verify context budget
        run: python tools/measure_context.py --check

      - name: Report package size
        run: python tools/report_sizes.py --format summary

      - name: Check patch whitespace
        run: git diff --check

      - name: Parse Bash installer
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Verify Unix installer transactions
        if: runner.os != 'Windows'
        run: python verification/verify_installers.py

      - name: Parse PowerShell files
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object ToString; exit 1 }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\extensions\ams-runtime-observation\tools\Inspect-AgentRuntime.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object ToString; exit 1 }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\verification\Verify-RuntimeObservation.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object ToString; exit 1 }

      - name: Verify Windows installer transactions
        if: runner.os == 'Windows'
        run: python verification/verify_installers_windows.py

      - name: Verify multi-harness installer targets
        run: python verification/verify_harness_installers.py

      - name: Verify production Desktop bootstrap boundaries
        run: python verification/verify_desktop_bootstrap.py

      - name: Verify public remote profile source
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: python -c "from tools.install_harnesses import package_profiles; assert len(package_profiles(False)) == 23"

      - name: Verify public remote Windows install
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $env:AMS_SKILL_HOME = Join-Path $env:RUNNER_TEMP 'ams-remote-skills'
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'ams-remote-codex'
          $script = Invoke-RestMethod 'https://raw.githubusercontent.com/InsecurePassword/Codex-AMS/main/tools/install_harnesses.py' -ErrorAction Stop
          $script | python - --harness codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:AMS_SKILL_HOME 'adaptive-master-subagent-orchestration\SKILL.md'))) { exit 1 }
          if (@(Get-ChildItem (Join-Path $env:CODEX_HOME 'agents\ams_*.toml')).Count -ne 24) { exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Codex for discovery test (no model calls)
        run: npm install --global @openai/codex
      - name: Verify native Codex skill and plugin discovery
        run: python verification/verify_harness_installers.py --codex-discovery

      - name: Install native OpenCode for discovery test (no model calls)
        run: npm install --global opencode-ai
      - name: Verify native OpenCode installer and agent discovery
        run: python verification/verify_harness_installers.py --opencode-discovery

      - name: Verify Windows runtime-observation fixture
        if: runner.os == 'Windows'
        shell: powershell
        run: .\verification\Verify-RuntimeObservation.ps1

  production-desktop:
    name: Windows / official production Desktop without CLI
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract official OpenCode Desktop 1.18.30
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'opencode-desktop.exe'
          Invoke-WebRequest 'https://github.com/anomalyco/opencode/releases/download/v1.18.30/opencode-desktop-win-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dcf723272c930f5dfa73a8561818ae4ad1a346384a859111ffeb554e19ce6567') { throw 'Desktop archive hash mismatch' }
          $outer = Join-Path $env:RUNNER_TEMP 'opencode-setup'
          $desktop = Join-Path $env:RUNNER_TEMP 'opencode-production'
          & 7z x $setup "-o$outer" -y
          if ($LASTEXITCODE -ne 0) { throw 'Desktop setup extraction failed' }
          $payload = @(Get-ChildItem $outer -Recurse -Filter 'app-64.7z')
          if ($payload.Count -ne 1) { throw 'Desktop payload not found' }
          & 7z x $payload[0].FullName "-o$desktop" -y
          if ($LASTEXITCODE -ne 0) { throw 'Desktop application extraction failed' }
          if (-not (Test-Path (Join-Path $desktop 'resources\app.asar'))) { throw 'Production app.asar missing' }
      - name: Verify Desktop-only installation and reinstall (no model calls)
        shell: pwsh
        run: python verification/verify_desktop_bootstrap.py --native (Join-Path $env:RUNNER_TEMP 'opencode-production')
